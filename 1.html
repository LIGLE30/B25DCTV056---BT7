<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Calculator</title>
    
    
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f6f8;
            font-family: Arial, sans-serif;
        }
        .calculator {
            width: 320px;
            border: 1px solid #ccc;
            background-color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        .display {
            background-color: #d3d3d3;
            height: 80px;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 15px;
            font-size: 24px;
            box-sizing: border-box;
            border-bottom: 2px solid #333;
            word-wrap: break-word;
            word-break: break-all;
        }
        /* Lưới các nút bấm */
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
        }
        
        .button {
            padding: 15px;
            font-size: 16px;
            border: 1px solid #333;
            cursor: pointer;
            text-align: center;
            color: black;
            font-weight: 500;
        }
        .button:active {
            opacity: 0.8;
        }
        .empty {
            background-color: white;
            border: none;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

   
    <script type="text/babel">
        // 1. Component Display hiển thị kết quả
        const Display = ({ value }) => {
            return (
                <div className="display">
                    {value}
                </div>
            );
        };

        
        const Button = ({ label, color, onClick, isEmpty }) => {
            if (isEmpty) {
                return <div className="button empty"></div>;
            }
            return (
                <button
                    className="button"
                    style={{ backgroundColor: color }}
                    onClick={() => onClick(label)}
                >
                    {label}
                </button>
            );
        };

        
        const Calculator = () => {
            
            const [expression, setExpression] = React.useState('');

            
            const handleButtonClick = (label) => {
                if (label === 'Clear' || label === 'C') {
                    setExpression(''); 
                } else if (label === 'Delete') {
                    setExpression(prev => prev.slice(0, -1)); 
                } else if (label === '=') {
                    try {
                        
                        let result = eval(expression);
                        setExpression(result.toString());
                    } catch (error) {
                        setExpression('Error');
                    }
                } else {
                    
                    if (expression === 'Error') {
                        setExpression(label);
                    } else {
                        setExpression(prev => prev + label);
                    }
                }
            };

            
            const buttons = [
                ['Clear', 'Delete', '.', '/'],
                ['7', '8', '9', '*'],
                ['4', '5', '6', '-'],
                ['1', '2', '3', '+'],
                [null, '0', '=', null] 
            ];

            return (
                <div className="calculator">
                    <Display value={expression} />
                    
                    <div className="keypad">
                        {buttons.flat().map((btnLabel, index) => (
                            <Button
                                key={index}
                                label={btnLabel}
                                color="#4CAF50" 
                                isEmpty={btnLabel === null}
                                onClick={handleButtonClick}
                            />
                        ))}
                    </div>
                </div>
            );
        };

        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Calculator />);
    </script>
</body>
</html>
